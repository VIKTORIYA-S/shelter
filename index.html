<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+Georgian:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Source+Code+Pro&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Shelter</title>
</head>
<body>
    <div class="start_screen">
        <div class="container">
            <header class="header">
                <div class="logo">
                    <h1 class="logo__title">Cozy House</h1>
                    <p class="logo__subtitle">Shelter for pets in Boston</p>
                </div>
                <nav class="nav">
                    <a class="nav__menu active" href="#">About the shelter</a>
                    <a class="nav__menu" href="#">Our pets</a>
                    <a class="nav__menu" href="#">Help the shelter</a>
                </nav>
            </header>
            <section class="hero">
                <div class="hero__content">
                    <h2 class="hero__title">Not only people <br> need a house</h2>
                    <p class="hero__subtitle">We offer to give a chance to a little and nice puppy with an extremely wide and open heart. He or she will love you more than anybody in the world, you will see!</p>
                    <button class="hero__button">Make a friend</button>
                </div>
                <img src="assets/images/start-screen-puppy.png" alt="dog" class="hero__img">   
            </section>
        </div>
</body>
</html>
